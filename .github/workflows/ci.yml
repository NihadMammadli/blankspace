# Pull-request check: the same install, typecheck and build as the deploy, so
# nothing reaches main that cannot be published.

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Build (content check → static export → SEO audit)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.blankspace.brussels
